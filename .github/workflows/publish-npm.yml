name: Publish to npm

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishers (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runway_engine

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build Rust/WASM engine
        run: npm run build:engine

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest # trusted publishing requires npm CLI >= 11.5.1

      - name: Check if version is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          echo "Package name: $PKG_NAME"
          echo "Local version: $LOCAL_VERSION"
          echo "Published npm version: $NPM_VERSION"
          if [ "$LOCAL_VERSION" == "$NPM_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Note: `prepublishOnly` (npm run build:lib) runs automatically as part of `npm publish`,
      # so the Vite library build doesn't need its own separate step here.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
